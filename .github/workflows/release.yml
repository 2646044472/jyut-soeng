name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate bundled content
        run: |
          python3 tools/build_assets.py
          if [ "$GITHUB_REF_NAME" = "v0.22.0" ]; then
            python3 tools/validate_content.py --min-sentences 1110
          elif [ "$GITHUB_REF_NAME" = "v0.23.0" ]; then
            python3 tools/validate_content.py --min-sentences 1180
          elif [ "$GITHUB_REF_NAME" = "v0.24.0" ]; then
            python3 tools/validate_content.py --min-sentences 1320
          else
            python3 tools/validate_content.py --min-sentences 5000
          fi
          python3 -m unittest discover -s tools/tests -p 'test*.py'

      - name: Restore release keystore
        env:
          YUET_SOENG_KEYSTORE_B64: ${{ secrets.YUET_SOENG_KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          if [ -z "$YUET_SOENG_KEYSTORE_B64" ]; then
            echo "YUET_SOENG_KEYSTORE_B64 is required for a signed release; configure it in repository Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$YUET_SOENG_KEYSTORE_B64" | base64 --decode > signing/yuet-soeng-sideload.jks
          test -s signing/yuet-soeng-sideload.jks

      - name: Build and test
        run: |
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Prepare APK artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/yuet-soeng-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "jyut-soeng ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/*.apk
