name: Release

on:
  push:
    branches:
      - "release/candidate-*"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 55
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate bundled content
        run: |
          python3 tools/build_assets.py
          if [ "$GITHUB_REF_NAME" = "v0.22.0" ]; then
            python3 tools/validate_content.py --min-sentences 1110
          elif [ "$GITHUB_REF_NAME" = "v0.23.0" ]; then
            python3 tools/validate_content.py --min-sentences 1180
          elif [ "$GITHUB_REF_NAME" = "v0.24.0" ]; then
            python3 tools/validate_content.py --min-sentences 1320
          else
            python3 tools/validate_content.py --require-story-upgrade --min-sentences 2000
          fi
          python3 tools/active_oral_ledger_audit.py
          JYUT_SOENG_REQUIRE_COMPLETE_STORIES=1 python3 -m unittest discover -s tools/tests -p 'test*.py'
          python3 tools/export_github_pack.py

      - name: Restore release keystore
        env:
          YUET_SOENG_KEYSTORE_B64: ${{ secrets.YUET_SOENG_KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          if [ -n "$YUET_SOENG_KEYSTORE_B64" ]; then
            printf '%s' "$YUET_SOENG_KEYSTORE_B64" | base64 --decode > signing/yuet-soeng-sideload.jks
          else
            git show v0.6.1:signing/yuet-soeng-sideload.jks > signing/yuet-soeng-sideload.jks
          fi
          test -s signing/yuet-soeng-sideload.jks

      - name: Build and test
        run: |
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Prepare release artifacts
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "v$VERSION" = "$GITHUB_REF_NAME"; fi
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/yuet-soeng-${VERSION}.apk"
          cd dist/github
          zip -rq "../../release-artifacts/yuet-soeng-content-${VERSION}.zip" jyut-soeng
          cp "../../release-artifacts/yuet-soeng-content-${VERSION}.zip" "../../release-artifacts/yuet-soeng-content.zip"

      - name: Check release signature, application ID and offline content against previous APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v0.36.3 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          python3 tools/verify_release_apk.py "$RUNNER_TEMP"/previous/*.apk release-artifacts/*.apk release-artifacts/yuet-soeng-content.zip

      - name: Start an isolated Android 35 emulator
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --name jyut-smoke -k "system-images;android-35;google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" -avd jyut-smoke -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          for i in $(seq 1 90); do
            [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == 1 ]] && break
            sleep 3
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1

      - name: Smoke-test fresh install and v0.36.3 cover install without network
        env:
          JYUT_DISPOSABLE_EMULATOR: "1"
          ANDROID_SERIAL: emulator-5554
        run: |
          python3 tools/smoke_android_upgrade.py "$RUNNER_TEMP"/previous/*.apk release-artifacts/*.apk

      - name: Retain verified binaries, never signing files or emulator data
        uses: actions/upload-artifact@v4
        with:
          name: verified-${{ github.sha }}
          path: |
            release-artifacts/*.apk
            release-artifacts/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-${{ github.sha }}
          path: release-artifacts
      - name: Publish verified APK and content pack
        uses: softprops/action-gh-release@v2
        with:
          name: "jyut-soeng ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/*.apk
            release-artifacts/*.zip
